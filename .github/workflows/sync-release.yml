name: Sync Release Assets to Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (empty = latest release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-release-assets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag and version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG=$(gh release list --repo 1061139531/fensanxin-updates --limit 1 --json tagName -q '.[0].tagName')
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release assets
        run: |
          mkdir -p _assets
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo 1061139531/fensanxin-updates \
            --dir _assets --clobber --pattern 'fensanxin-*'
          ls -la _assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy exe and blockmap to repo root
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          if [ -f "_assets/fensanxin-${VER}.exe" ]; then
            cp "_assets/fensanxin-${VER}.exe" "分散信-安装包-${VER}.exe"
          fi
          if [ -f "_assets/fensanxin-${VER}.exe.blockmap" ]; then
            cp "_assets/fensanxin-${VER}.exe.blockmap" "分散信-安装包-${VER}.exe.blockmap"
          fi

      - name: Regenerate latest.yml
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          EXE="分散信-安装包-${VER}.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::missing exe for version ${VER}"
            exit 1
          fi
          SHA=$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)
          SIZE=$(stat -c%s "$EXE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          {
            echo "version: ${VER}"
            echo "files:"
            echo "  - url: ${EXE}"
            echo "    sha512: ${SHA}"
            echo "    size: ${SIZE}"
            echo "path: ${EXE}"
            echo "sha512: ${SHA}"
            echo "releaseDate: '${DATE}'"
          } > latest.yml
          echo "--- latest.yml ---"
          cat latest.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release ${{ steps.meta.outputs.tag }}" --allow-empty
          git push origin main
